version: '3.8'

services:
  nonwoven-server:
    build: .
    container_name: nonwoven-api
    ports:
      - "3000:3000"
    volumes:
      # 数据库文件挂载到宿主机目录 (容器外)
      - /opt/nonwoven-data:/app/data
      - ./.env.production:/app/.env:ro
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
